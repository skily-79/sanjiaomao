[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ballontranslator"
version = "1.5.12"
description = "Comic image translation desktop app based on https://github.com/dmMaze/BallonsTranslator"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = {text = "GPL-3.0-or-later"}

[project.scripts]
ballontranslator = "ballontranslator.launch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ballontranslator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
